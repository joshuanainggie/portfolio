site_name: "Joshua Nainggie — Technical Writing"
site_description: documentation and technical writing on Microsoft 365, Azure, and automation
site_url: https://joshuanainggie.github.io/portfolio/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - About: index.md
  - Runbooks:
      - Offboarding a Microsoft 365 user: offboarding-m365.md
